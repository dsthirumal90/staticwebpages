<html>
	<head>
	<style>
		#demo {
			border: 1px solid black;
			margin: 5px;
		}
	</style>
	</head>
	<body>
		<h3 class="demo">Query Selectors All...</h3>
		<div id="demo">
			<p>Paragraph 1</p>
			<p>Paragraph 2</p>
		</div>
		<p>Paragraph 3</p>
		<button onclick="myFunction()"> Click Me... </button>
	<script>
		function myFunction() {
			
			document.getElementById("demo").style.backgroundColor="yellow";
		
			let x = document.getElementById("demo").querySelectorAll("p");
			
			for(i = 0; i<x.length; i++) {
				x[i].style.backgroundColor = "green";
				
				x[i].style.color = "pink";
			}
			
		}
	</script>
	</body>
	
</html>
